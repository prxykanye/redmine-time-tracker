[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redmine-time-tracker"
version = "0.2.0"
description = "Desktop time tracker for Redmine with local drafts and rounded publishing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "redmine-time-tracker contributors" }]
keywords = ["redmine", "time-tracking", "pyside6", "qt", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "PySide6>=6.8",
    "platformdirs>=4.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]

[project.gui-scripts]
redmine-time-tracker = "redmine_time_tracker.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/redmine_time_tracker"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # The interface is Russian; Cyrillic words inside strings are expected.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["redmine_time_tracker"]

[tool.ruff.lint.per-file-ignores]
"docs/render_screenshot.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["dotenv.*", "keyring", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
